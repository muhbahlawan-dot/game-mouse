<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tank Perang 3D</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #0b1118;
      overflow: hidden;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      color: #fff;
      user-select: none
    }

    canvas {
      display: block
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none
    }

    #st {
      position: absolute;
      top: 14px;
      left: 16px;
      font-weight: bold;
      font-size: 16px;
      text-shadow: 0 1px 4px #000;
      line-height: 1.5
    }

    #tm {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 17px;
      background: rgba(10, 15, 20, .55);
      padding: 4px 14px;
      border-radius: 8px;
      white-space: nowrap
    }

    #ind {
      position: absolute;
      left: 50%;
      top: 50%;
      margin: -130px 0 0 -130px
    }

    #gm {
      position: absolute;
      width: 14px;
      height: 14px;
      margin: -7px;
      border: 2px solid #ffd27a;
      border-radius: 50%;
      display: none
    }

    #rng {
      position: absolute;
      left: 50%;
      top: calc(50% + 36px);
      transform: translateX(-50%);
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 1px 3px #000;
      white-space: nowrap
    }

    #dm {
      position: absolute;
      top: 14px;
      right: 16px;
      border-radius: 8px
    }

    #mm {
      position: absolute;
      right: 14px;
      bottom: 14px;
      border-radius: 8px;
      border: 1px solid #52667d
    }

    #zv {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 24%, rgba(0, 0, 0, .88) 62%);
      opacity: 0;
      transition: opacity .2s
    }

    #feed {
      position: absolute;
      left: 16px;
      top: 84px;
      font-size: 13px;
      line-height: 1.5;
      text-shadow: 0 1px 3px #000;
      max-width: 46vw;
      font-weight: bold
    }

    #bars {
      position: absolute;
      left: 16px;
      bottom: 18px;
      width: min(240px, 50vw)
    }

    #bars div {
      height: 12px;
      background: rgba(0, 0, 0, .55);
      border-radius: 6px;
      overflow: hidden
    }

    #rl {
      display: block;
      height: 100%;
      background: #ffb703
    }

    #spd {
      position: absolute;
      left: 16px;
      bottom: 40px;
      font-size: 34px;
      font-weight: bold;
      text-shadow: 0 2px 6px #000
    }

    #spd small {
      font-size: 14px
    }

    #am {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      display: flex;
      gap: 6px
    }

    .chip {
      background: rgba(0, 0, 0, .6);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid transparent
    }

    .chip.s {
      border-color: #ffb703
    }

    #rep {
      position: absolute;
      left: 50%;
      bottom: 64px;
      transform: translateX(-50%);
      font-size: 15px;
      font-weight: bold;
      text-shadow: 0 1px 3px #000;
      text-align: center;
      white-space: nowrap
    }

    #xp {
      position: absolute;
      left: 16px;
      bottom: 170px;
      width: 300px;
      height: 190px;
      border: 2px solid #9ff;
      box-sizing: border-box;
      display: none
    }

    #xp i {
      position: absolute;
      left: 0;
      top: -22px;
      font-style: normal;
      font-size: 12px;
      font-weight: bold;
      color: #9ff;
      text-shadow: 0 1px 3px #000
    }

    #xr {
      position: absolute;
      left: 16px;
      bottom: 120px;
      width: 300px;
      font-size: 13px;
      font-weight: bold;
      color: #9ff;
      text-shadow: 0 1px 3px #000
    }

    #fl {
      position: absolute;
      inset: 0;
      background: #f00;
      opacity: 0
    }

    #msg {
      position: absolute;
      top: 20%;
      width: 100%;
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      text-shadow: 0 2px 8px #000
    }

    .ok {
      color: #2ecc71
    }

    .bad {
      color: #ff4d6d
    }

    #ov {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(rgba(8, 12, 17, .75), rgba(8, 12, 17, 0) 22%, rgba(8, 12, 17, 0) 40%, rgba(8, 12, 17, .94) 66%)
    }

    #ov .top {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px 18px;
      font-weight: bold
    }

    #ov .top h1 {
      margin: 0;
      font-size: 22px
    }

    .mp,
    .nt {
      padding: 6px 12px;
      border-radius: 6px;
      background: #1a232e;
      cursor: pointer;
      font-size: 14px;
      border: 2px solid transparent;
      white-space: nowrap
    }

    .mp.sel,
    .nt.sel {
      border-color: #ffb703
    }

    .nt {
      font-size: 15px
    }

    #ov .bot {
      padding: 10px 18px 16px;
      text-align: center
    }

    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 10px 0
    }

    .card {
      background: #1a232e;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      min-width: 130px;
      border: 2px solid transparent;
      font-size: 14px
    }

    .card.sel {
      border-color: #ffb703
    }

    .card small {
      color: #8a96a3
    }

    .info {
      font-size: 12.5px;
      color: #b8c4d0;
      margin: 3px auto;
      max-width: 900px;
      line-height: 1.5
    }

    .play {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 56px;
      background: #ff8a1a;
      color: #1b1208;
      border-radius: 6px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px
    }

    .note {
      color: #ffd27a;
      font-weight: bold;
      margin-bottom: 4px
    }
  </style>
</head>

    function drawInd() {

    }
    function rangeTo() {
      const d = new V(); cam.getWorldDirection(d); const p = cam.position.clone(), g = pl.g.position;
      for (let i = 1; i <= 500; i++) {
        p.addScaledVector(d, 2);

        for (const t of tanks) if (!t.dead && t !== pl && t.g.position.distanceTo(p) < 3.2) return p.distanceTo(g);

      }

    }

    let last = performance.now(), T0 = 0;
    function loop(now) {
      requestAnimationFrame(loop); const dt = Math.min(.033, (now - last) / 1000); last = now; T0 += dt; const play = st === 'play';
      if (play) {

        }

        cam.position.lerp(tp, zoom ? 1 : 1 - Math.exp(-12 * dt)); cam.lookAt(g.x + d.x * 30, g.y + 2.5 + 30 * Math.tan(aimPitch), g.z + d.z * 30);
        const fv = zoom ? 20 : 62; if (Math.abs(cam.fov - fv) > .1) { cam.fov += (fv - cam.fov) * Math.min(1, dt * 12); cam.updateProjectionMatrix() }
        pl.g.visible = !zoom; cam.updateMatrixWorld(true); $('zv').style.opacity = zoom ? 1 : 0;
        const rg = rangeTo(); $('rng').innerHTML = (rg ? Math.round(rg) + ' m' : '--- m') + ' · ' + slotT(pl.spec, pl.sel).n;
        pl.g.updateMatrixWorld(true); pl.gp.getWorldPosition(A); pl.mz.getWorldPosition(B); const gd = B.clone().sub(A).normalize(), gpt = B.clone().addScaledVector(gd, rg || 200).project(cam), gm = $('gm');
        if (gpt.z < 1) { gm.style.display = 'block'; gm.style.left = ((gpt.x * .5 + .5) * innerWidth) + 'px'; gm.style.top = ((-gpt.y * .5 + .5) * innerHeight) + 'px' } else gm.style.display = 'none';
        $('rl').style.width = clamp(100 - Math.max(0, pl.rl) / pl.rlMax * 100, 0, 100) + '%';
        $('am').innerHTML = [0, 1, 2, 3].filter(i => pl.spec.ammo[i] > 0).map(i => '<span class="chip' + (i === pl.sel ? ' s' : '') + '">' + (i + 1) + ' ' + slotT(pl.spec, i).n + ' ' + pl.am[i] + '</span>').join('');
        $('spd').innerHTML = Math.round(Math.abs(pl.sp) * 3.6) + '<small> km/j</small>';
        $('tm').innerHTML = '🟢 ' + tanks.filter(t => t.team === 0 && !t.dead).length + ' &nbsp;vs&nbsp; 🔴 ' + tanks.filter(t => t.team === 1 && !t.dead).length + ' · Gel. ' + wave;
        $('st').innerHTML = 'Skor ' + score + ' · +' + earn + ' SL' + (pl.fire > 0 ? '<br><span class="bad">🔥 KEBAKARAN! ' + (pl.ext ? 'Tekan F ' : 'Tanpa pemadam ') + Math.ceil(12 - pl.fire) + 'd</span>' : '');
        const dmg = ['trk', 'gun', 'eng'].find(k => !pl.m[k]), al = Math.max(1, pl.m.crew.filter(x => x).length);
        $('rep').innerHTML = rep ? '🔧 Memperbaiki ' + REPN[rep.k][0] + ' ' + Math.min(100, Math.round(rep.t / (REPN[rep.k][1] * 4 / al) * 100)) + '%' + (Math.abs(pl.sp) >= 1.5 ? ' <span class="bad">· berhenti dulu!</span>' : '') : dmg ? '<span class="bad">R: perbaiki ' + REPN[dmg][0] + '</span>' : '';
        for (const f of feedL) f.t -= dt; feedL = feedL.filter(f => f.t > 0);
        $('feed').innerHTML = feedL.map(f => '<div style="color:' + f.col + ';opacity:' + Math.min(1, f.t / 2) + '">' + f.txt + '</div>').join('');
        for (const h of hitI) h.t -= dt; hitI = hitI.filter(h => h.t > 0); if (hmk > 0) hmk -= dt;
        drawMM(); drawDM(); drawInd();
      } else {
        const g = pl.g.position, R = pl.spec.hull.L * 1.9; pl.g.visible = true; zoom = 0; cam.fov = 50; cam.updateProjectionMatrix();
        cam.position.set(g.x + Math.cos(T0 * .3) * R, g.y + R * .38, g.z + Math.sin(T0 * .3) * R); cam.lookAt(g.x, g.y + 1, g.z); tl.visible = mk.visible = false;
        for (const k of ['st', 'tm', 'am', 'spd', 'rng', 'rep', 'feed']) $(k).innerHTML = ''; $('gm').style.display = 'none'; $('zv').style.opacity = 0;
        mmc.clearRect(0, 0, 150, 150); dmc.clearRect(0, 0, 200, 150); inc.clearRect(0, 0, 260, 260); if (xr) endX();
        const m = pl.spec.tur ? pl.tu : null; if (m) pl.tu.rotation.y = Math.sin(T0 * .5) * .5; phys(pl, dt, 0, 0); pl.dl += dt * 1.5; pl.dr += dt * 1.5
      }
      if (sh > .01) { cam.position.x += rnd(-1, 1) * sh * .5; cam.position.y += rnd(-1, 1) * sh * .5; sh *= Math.exp(-6 * dt) }
      updP(dt);
      if (msgT > 0) { msgT -= dt; if (msgT <= 0) $('msg').textContent = '' }
      $('fl').style.opacity = Math.max(0, +$('fl').style.opacity - dt * 1.2);
      ren.render(scene, cam);

        const e = p.clone().addScaledVector(d, 3 * Math.min(1, xr.t / .6)); xr.pos.setXYZ(0, p.x, p.y, p.z); xr.pos.setXYZ(1, e.x, e.y, e.z); xr.pos.needsUpdate = true; xr.head.position.copy(e);
        xView(true); ren.setScissorTest(true); ren.setScissor(16, 170, 300, 190); ren.setViewport(16, 170, 300, 190); ren.render(scene, xc); ren.setScissorTest(false); ren.setViewport(0, 0, innerWidth, innerHeight); xView(false);
        $('xr').textContent = nm(t) + ' · ' + xr.msg; if (xr.t >= xr.dur) endX()
      }
      if (pend) { const w = pend; pend = null; endBattle(w) }
    }
    if (!tank$(sv.sel) || !sv.own.includes(sv.sel)) { sv.sel = 't34'; sv.nat = 'ussr' }
