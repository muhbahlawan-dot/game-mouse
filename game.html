 speckle(x,w,42000,cols,5);
 if(kind==='sand'){x.strokeStyle='rgba(120,95,55,.15)';for(let i=0;i<14;i++){x.beginPath();x.moveTo(0,i*19+rnd(-4,4));for(let k=0;k<=8;k++)x.lineTo(k*32,i*19+rnd(-5,5));x.stroke()}}

  const g=pl.g.position,dist=7+pl.spec.hull.L*1.05,th=pl.topH,dxy=new V(-Math.sin(aimYaw),0,-Math.cos(aimYaw));
  const tp=zoom?new V(g.x+dxy.x*1.2,g.y+th*.95+.5,g.z+dxy.z*1.2):new V(g.x-dxy.x*dist,g.y+th+2.2+dist*.12,g.z-dxy.z*dist);tp.y=Math.max(tp.y,hgt(tp.x,tp.z)+1.6);

  aimAtCrosshair(dt);{const zk=zoom?[0,1.3,1.8,2.4][zoom|0]:.35,mv=Math.min(1,Math.abs(pl.sp)/6);cam.rotateX((pl.pitch-(pl.tp||0))*zk+Math.sin(T0*41)*.0007*mv*(1+pl.rough*3)*(zoom?1.5:.5));cam.rotateZ(-pl.roll*(zoom?.7:.15)+Math.sin(T0*37)*.0005*mv*(zoom?1.5:.5));cam.updateMatrixWorld(true)}

  hudUpdate(dr)}
 else if(st==='dead'&&pl){deadT+=dr;const g=pl.g.position,R=pl.spec.hull.L*.95+3.5;pl.g.visible=true;

 else if(st==='lobby'){const g=pl.g.position,R=pl.spec.hull.L*1.75+3;pl.g.visible=true;zoom=0;setFov(40);if(!hang.drag)hang.a+=dr*.1;

  if(xr)endX();if(pl.spec.tur)pl.tu.rotation.y=Math.sin(T0*.4)*.25;phys(pl,dr,0,0)}

 if(thQ.length&&(st==='lobby'||st==='spawn'))thStep();
 const fp=(pl&&(st==='play'||st==='dead'||st==='lobby'))?pl.g.position:cam.position;sun.target.position.copy(fp);sun.position.copy(fp).addScaledVector(sunDir,220);sun.target.updateMatrixWorld();
